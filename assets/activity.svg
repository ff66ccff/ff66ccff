<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="100%">
  <defs>
    <linearGradient id="act-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", "JetBrains Mono", Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    .card-panel { fill: #0d1322; stroke: #1e293b; stroke-width: 1; }
    .metric-title { font-family: ui-monospace, "SF Mono", monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; fill: #38bdf8; }
    .metric-item { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #cbd5e1; }
    .metric-bullet { fill: #10b981; }
  </style>

  <!-- Card Background -->
  <rect width="900" height="170" rx="14" fill="url(#act-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <path d="M 0 14 Q 0 0 14 0 L 886 0 Q 900 0 900 14 L 900 34 L 0 34 Z" fill="#0e1626" fill-opacity="0.7" />
  <line x1="0" y1="34" x2="900" y2="34" stroke="#1e293b" stroke-width="1" />

  <!-- Traffic Dots -->
  <circle cx="24" cy="17" r="4.5" fill="#ef4444" />
  <circle cx="38" cy="17" r="4.5" fill="#f59e0b" />
  <circle cx="52" cy="17" r="4.5" fill="#10b981" />

  <text x="70" y="21" class="mono" font-size="11" fill="#64748b" font-weight="500">telemetry // engineering-activity-status</text>
  
  <g transform="translate(734, 9)">
    <rect width="142" height="18" rx="9" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1" />
    <circle cx="12" cy="9" r="3.5" fill="#34d399" />
    <text x="22" y="13" class="mono" font-size="9.5" font-weight="600" fill="#34d399">100% RELIABLE (LOCAL)</text>
  </g>

  <!-- 3 Column Panels -->
  <!-- Panel 1: Current Focus -->
  <g transform="translate(24, 46)">
    <rect width="268" height="106" rx="8" class="card-panel" />
    <text x="16" y="22" class="metric-title">// RESEARCH &amp; FOCUS</text>
    
    <circle cx="20" cy="44" r="3" class="metric-bullet" />
    <text x="30" y="48" class="metric-item">AI Agents &amp; Intelligent Systems</text>

    <circle cx="20" cy="66" r="3" class="metric-bullet" />
    <text x="30" y="70" class="metric-item">Software Architecture &amp; Design</text>

    <circle cx="20" cy="88" r="3" class="metric-bullet" />
    <text x="30" y="92" class="metric-item">Modern C++ &amp; High-perf Utilities</text>
  </g>

  <!-- Panel 2: Engineering Principles -->
  <g transform="translate(316, 46)">
    <rect width="268" height="106" rx="8" class="card-panel" />
    <text x="16" y="22" class="metric-title" fill="#a855f7">// CORE PRINCIPLES</text>

    <circle cx="20" cy="44" r="3" fill="#a855f7" />
    <text x="30" y="48" class="metric-item">Zero Unnecessary Dependencies</text>

    <circle cx="20" cy="66" r="3" fill="#a855f7" />
    <text x="30" y="70" class="metric-item">High Stability &amp; Reliability</text>

    <circle cx="20" cy="88" r="3" fill="#a855f7" />
    <text x="30" y="92" class="metric-item">Building Tools with Real Utility</text>
  </g>

  <!-- Panel 3: Active Repositories -->
  <g transform="translate(608, 46)">
    <rect width="268" height="106" rx="8" class="card-panel" />
    <text x="16" y="22" class="metric-title" fill="#34d399">// REPOSITORY CADENCE</text>

    <circle cx="20" cy="44" r="3" fill="#38bdf8" />
    <text x="30" y="48" class="metric-item">SCU-Nexus (C++ / Qt)</text>

    <circle cx="20" cy="66" r="3" fill="#fde047" />
    <text x="30" y="70" class="metric-item">SCU-E-course-Enhancer (JS)</text>

    <circle cx="20" cy="88" r="3" fill="#c084fc" />
    <text x="30" y="92" class="metric-item">Curated Academic Knowledge</text>
  </g>
</svg>