<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="100%">
  <defs>
    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", "JetBrains Mono", Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    .badge-bg { fill: #111827; stroke: #1f293d; stroke-width: 1; }
    .badge-text { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", monospace; font-size: 11px; font-weight: 600; }
    .cat-title { font-family: ui-monospace, "SF Mono", monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
  </style>

  <!-- Card Background -->
  <rect width="900" height="170" rx="14" fill="url(#stack-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <path d="M 0 14 Q 0 0 14 0 L 886 0 Q 900 0 900 14 L 900 34 L 0 34 Z" fill="#0e1626" fill-opacity="0.7" />
  <line x1="0" y1="34" x2="900" y2="34" stroke="#1e293b" stroke-width="1" />

  <!-- Traffic Dots -->
  <circle cx="24" cy="17" r="4.5" fill="#ef4444" />
  <circle cx="38" cy="17" r="4.5" fill="#f59e0b" />
  <circle cx="52" cy="17" r="4.5" fill="#10b981" />

  <text x="70" y="21" class="mono" font-size="11" fill="#64748b" font-weight="500">toolchain // core-technologies-matrix</text>

  <!-- Row 1: Languages -->
  <g transform="translate(30, 68)">
    <text x="0" y="0" class="cat-title" fill="#38bdf8">LANGUAGES &gt;</text>

    <!-- C++ -->
    <g transform="translate(130, -16)">
      <rect width="84" height="26" rx="6" class="badge-bg" stroke="#0284c7" stroke-opacity="0.6" />
      <circle cx="16" cy="13" r="5" fill="#00599c" />
      <text x="28" y="17" class="badge-text" fill="#e0f2fe">C++ 20</text>
    </g>

    <!-- Python -->
    <g transform="translate(224, -16)">
      <rect width="86" height="26" rx="6" class="badge-bg" stroke="#eab308" stroke-opacity="0.4" />
      <circle cx="16" cy="13" r="5" fill="#3776ab" />
      <text x="28" y="17" class="badge-text" fill="#fef08a">Python</text>
    </g>

    <!-- Java -->
    <g transform="translate(320, -16)">
      <rect width="76" height="26" rx="6" class="badge-bg" stroke="#ea580c" stroke-opacity="0.4" />
      <circle cx="16" cy="13" r="5" fill="#f89820" />
      <text x="28" y="17" class="badge-text" fill="#fed7aa">Java</text>
    </g>

    <!-- TypeScript -->
    <g transform="translate(406, -16)">
      <rect width="112" height="26" rx="6" class="badge-bg" stroke="#3b82f6" stroke-opacity="0.4" />
      <circle cx="16" cy="13" r="5" fill="#3178c6" />
      <text x="28" y="17" class="badge-text" fill="#bfdbfe">TypeScript</text>
    </g>

    <!-- JavaScript -->
    <g transform="translate(528, -16)">
      <rect width="108" height="26" rx="6" class="badge-bg" stroke="#ca8a04" stroke-opacity="0.4" />
      <circle cx="16" cy="13" r="5" fill="#f7df1e" />
      <text x="28" y="17" class="badge-text" fill="#fef9c3">JavaScript</text>
    </g>
  </g>

  <!-- Row 2: Systems & Tools -->
  <g transform="translate(30, 126)">
    <text x="0" y="0" class="cat-title" fill="#a855f7">SYSTEMS &gt;</text>

    <!-- Linux -->
    <g transform="translate(130, -16)">
      <rect width="80" height="26" rx="6" class="badge-bg" stroke="#64748b" stroke-opacity="0.4" />
      <circle cx="16" cy="13" r="5" fill="#f59e0b" />
      <text x="28" y="17" class="badge-text" fill="#f1f5f9">Linux</text>
    </g>

    <!-- Git -->
    <g transform="translate(220, -16)">
      <rect width="66" height="26" rx="6" class="badge-bg" stroke="#f43f5e" stroke-opacity="0.4" />
      <circle cx="16" cy="13" r="5" fill="#f05032" />
      <text x="28" y="17" class="badge-text" fill="#ffe4e6">Git</text>
    </g>

    <!-- Docker -->
    <g transform="translate(296, -16)">
      <rect width="84" height="26" rx="6" class="badge-bg" stroke="#0ea5e9" stroke-opacity="0.4" />
      <circle cx="16" cy="13" r="5" fill="#2496ed" />
      <text x="28" y="17" class="badge-text" fill="#e0f2fe">Docker</text>
    </g>

    <!-- Qt -->
    <g transform="translate(390, -16)">
      <rect width="64" height="26" rx="6" class="badge-bg" stroke="#22c55e" stroke-opacity="0.4" />
      <circle cx="16" cy="13" r="5" fill="#41cd52" />
      <text x="28" y="17" class="badge-text" fill="#dcfce7">Qt</text>
    </g>

    <!-- Spring Boot -->
    <g transform="translate(464, -16)">
      <rect width="118" height="26" rx="6" class="badge-bg" stroke="#16a34a" stroke-opacity="0.4" />
      <circle cx="16" cy="13" r="5" fill="#6db33f" />
      <text x="28" y="17" class="badge-text" fill="#bbf7d0">Spring Boot</text>
    </g>
  </g>
</svg>