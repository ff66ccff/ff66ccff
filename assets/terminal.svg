<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", "JetBrains Mono", Consolas, monospace; }
    .term-prompt { fill: #34d399; font-weight: 600; }
    .term-cmd { fill: #f8fafc; font-weight: 600; }
    .term-key { fill: #38bdf8; font-weight: 600; }
    .term-val { fill: #a5f3fc; }
    .term-str { fill: #fef08a; }
    .term-bracket { fill: #c084fc; font-weight: 600; }
    .term-muted { fill: #64748b; }
    .term-dim { fill: #94a3b8; }
    .term-cursor { fill: #38bdf8; }
  </style>

  <!-- Terminal Window Background -->
  <rect width="900" height="300" rx="14" fill="url(#term-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Terminal Window Top Bar -->
  <path d="M 0 14 Q 0 0 14 0 L 886 0 Q 900 0 900 14 L 900 36 L 0 36 Z" fill="#0e1626" fill-opacity="0.75" />
  <line x1="0" y1="36" x2="900" y2="36" stroke="#1e293b" stroke-width="1" />

  <!-- Traffic Dots -->
  <circle cx="24" cy="18" r="5" fill="#ef4444" />
  <circle cx="40" cy="18" r="5" fill="#f59e0b" />
  <circle cx="56" cy="18" r="5" fill="#10b981" />

  <!-- Terminal Title -->
  <text x="450" y="22" text-anchor="middle" class="mono term-muted" font-size="11.5" font-weight="500">ff66ccff@scu-workstation: ~ (zsh)</text>

  <!-- Terminal Content -->
  <!-- Line 1: Command whoami -->
  <g transform="translate(32, 64)">
    <text x="0" y="0" class="mono term-prompt" font-size="13">ff66ccff@scu:~$</text>
    <text x="135" y="0" class="mono term-cmd" font-size="13">whoami --verbose</text>
  </g>

  <!-- Line 2: JSON Output -->
  <g transform="translate(32, 88)" font-size="12.5" class="mono">
    <text x="0" y="0" class="term-bracket">{</text>
    
    <text x="20" y="20" class="term-key">"user"</text><text x="68" y="20" class="term-dim">:</text>
    <text x="82" y="20" class="term-str">"ff66ccff"</text><text x="162" y="20" class="term-dim">,</text>

    <text x="20" y="42" class="term-key">"role"</text><text x="68" y="42" class="term-dim">:</text>
    <text x="82" y="42" class="term-str">"Computer Science Undergraduate"</text><text x="330" y="42" class="term-dim">,</text>

    <text x="20" y="64" class="term-key">"university"</text><text x="116" y="64" class="term-dim">:</text>
    <text x="130" y="64" class="term-str">"Sichuan University (SCU)"</text><text x="330" y="64" class="term-dim">,</text>

    <text x="20" y="86" class="term-key">"interests"</text><text x="108" y="86" class="term-dim">:</text>
    <text x="122" y="86" class="term-bracket">[</text>
    <text x="134" y="86" class="term-str">"Artificial Intelligence"</text><text x="320" y="86" class="term-dim">,</text>
    <text x="330" y="86" class="term-str">"AI Agents"</text><text x="418" y="86" class="term-dim">,</text>
    <text x="428" y="86" class="term-str">"Software Engineering"</text><text x="604" y="86" class="term-bracket">],</text>

    <text x="20" y="108" class="term-key">"philosophy"</text><text x="116" y="108" class="term-dim">:</text>
    <text x="130" y="108" class="term-str">"Building lightweight, reliable software to solve real problems"</text><text x="674" y="108" class="term-dim">,</text>

    <text x="20" y="130" class="term-key">"status"</text><text x="84" y="130" class="term-dim">:</text>
    <text x="98" y="130" class="term-val" font-weight="600">"Compiling code, exploring agents, and architecting systems"</text>

    <text x="0" y="152" class="term-bracket">}</text>
  </g>

  <!-- Line 3: Next prompt with glowing cursor -->
  <g transform="translate(32, 268)">
    <text x="0" y="0" class="mono term-prompt" font-size="13">ff66ccff@scu:~$</text>
    <text x="135" y="0" class="mono term-cmd" font-size="13">inspect --featured-projects</text>
    <rect x="360" y="-12" width="8" height="15" rx="1" class="term-cursor" />
  </g>
</svg>